appId: ca.sangmi.newpos
productName: New POS System
executableName: new-pos-system
electronVersion: 44.7.0
copyright: Copyright 2026 Sang-Mi Consulting Ltd
directories:
  output: release
files:
  - dist/**/*
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: New-POS-System-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: New POS System
